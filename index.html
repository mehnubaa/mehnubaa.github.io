<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Removed</title>
    <style>
      :root {
        --bg: #f6f8fb;
        --panel: #ffffff;
        --border: #dfe7f1;
        --text: #1e2a39;
        --muted: #4b5e76;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 2rem 2.5rem;
        text-align: center;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.8rem;
      }
      p {
        margin: 0;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>This page has been removed</h1>
      <p>The homepage content was intentionally removed.</p>
    </div>
  </body>
</html>
